---
AWSTemplateFormatVersion: "2010-09-09"
Description: ECR Construction
###################################
# --------------------------------#
# Metadata
# --------------------------------#
###################################
Metadata:
  AWS::CloudFormation::Interface:
    # パラメータの並び順
    ParameterGroups:
      - Label:
          default: Project Configuration
        Parameters:
          - SystemId
          - EnvType
          - BillingID

      - Label:
          default: ECR Configuration
        Parameters:
          - RepositoryNameSuffix
          - Mutability
          - GenerationManagement
          - CrossAccountAccessAccountId1
          - CrossAccountAccessAccountId2
      
      - Label:
          default: KMS Configuration
        Parameters:
          - KMSKeyArn

###################################
#---------------------------------#
# Parameters Section
#---------------------------------#
###################################            
Parameters:
  SystemId:
    Type: String
    Description: Enter your system id.
    MinLength: 6
    MaxLength: 6
  EnvType:
    Type: String
    Description: Select the environment.
    AllowedValues:
      - c
      - t
      - k
      - v
      - e
      - i
      - s
      - m
      - p
  BillingID:
    Type: String
    Description: Enter the BillingID.

  # ecr
  RepositoryNameSuffix:
    Type: String
    Description: Enter your container repository name ecr-pri-(EnvType)-(SystemId)-(RepositoryNameSuffix)
  Mutability:
    Type: String
    Description: Choice your ecr tag immutability.
    Default: IMMUTABLE
    AllowedValues:
      - MUTABLE
      - IMMUTABLE
  GenerationManagement:
    Type: String
    Description: Enter the number of generations of Docker images to be managed.
    Default: ''
  CrossAccountAccessAccountId1:
    Type: String
    Description: Note! For Allow the cross account access, please enter a aws account(ex. 0123456789012).
  CrossAccountAccessAccountId2:
    Type: String
    Description: Note! For Allow the cross account access, please enter a aws account(ex. 0123456789012).
  
  # kms key
  KMSKeyArn:
    Type: String
    Description: Note! For accounts located in the Security Data OU, please enter the arn of your customer key arn.
    AllowedPattern: ^(arn:aws:kms:.*:(\d{12})?:(key|alias)/.+|)\Z
  
###################################
#---------------------------------#
# Conditions Section
#---------------------------------#
###################################   
Conditions:
  EncryptionByKMS: 
    !Not [!Equals [ !Ref KMSKeyArn, '']] 
  IsNotNullCrossAccountAccessAccountId1:
    !Not [!Equals [!Ref CrossAccountAccessAccountId1, '']]
  IsNotNullCrossAccountAccessAccountIds:
    !And
    - !Not [!Equals [!Ref CrossAccountAccessAccountId1, '']]
    - !Not [!Equals [!Ref CrossAccountAccessAccountId2, '']]
  IsEnabledGenerationManagement:
    !Not [!Equals [!Ref GenerationManagement , '']]

###################################
#---------------------------------#
# Resourcecs Section
#---------------------------------#
###################################          
Resources:
  #---------------------------------#
  # ECR
  #---------------------------------#
  Ecr:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ecr-pri-${EnvType}-${SystemId}-${RepositoryNameSuffix}
      ImageTagMutability: !Ref Mutability
      EncryptionConfiguration:
        !If
          - EncryptionByKMS
          - EncryptionType: KMS
            KmsKey: !Ref KMSKeyArn
          - EncryptionType: AES256
      LifecyclePolicy:
        !If
          - IsEnabledGenerationManagement
          - LifecyclePolicyText: !Sub |
              {
                "rules": [
                  {
                    "rulePriority": 1,
                    "description": "Delete more than ${GenerationManagement} images",
                    "selection": {
                      "tagStatus": "any",
                      "countType": "imageCountMoreThan",
                      "countNumber": ${GenerationManagement}
                    },
                    "action": {
                      "type": "expire"
                    }
                  }
                ]
              }
          - !Ref AWS::NoValue
      RepositoryPolicyText: 
        !If
          - IsNotNullCrossAccountAccessAccountIds
          - !Sub |
            {
              "Version": "2008-10-17",
              "Statement": [
                {
                  "Sid": "DGCPAllowCrossAccountPull",
                  "Effect": "Allow",
                  "Principal": {
                    "AWS": [
                      "arn:aws:iam::${CrossAccountAccessAccountId1}:root",
                      "arn:aws:iam::${CrossAccountAccessAccountId2}:root"
                    ]
                  },
                  "Action": [
                    "ecr:BatchCheckLayerAvailability",
                    "ecr:BatchGetImage",
                    "ecr:DescribeImages",
                    "ecr:DescribeRepositories",
                    "ecr:GetDownloadUrlForLayer",
                    "ecr:ListImages"
                  ]
                }
              ]
            }
          - !If
            - IsNotNullCrossAccountAccessAccountId1
            - !Sub |
              {
                "Version": "2008-10-17",
                "Statement": [
                  {
                    "Sid": "DGCPAllowCrossAccountPull",
                    "Effect": "Allow",
                    "Principal": {
                      "AWS": [
                        "arn:aws:iam::${CrossAccountAccessAccountId1}:root"
                      ]
                    },
                    "Action": [
                      "ecr:BatchCheckLayerAvailability",
                      "ecr:BatchGetImage",
                      "ecr:DescribeImages",
                      "ecr:DescribeRepositories",
                      "ecr:GetDownloadUrlForLayer",
                      "ecr:ListImages"
                    ]
                  }
                ]
              }
            - !Ref "AWS::NoValue"
      Tags:
        - Key: SystemId
          Value: !Ref SystemId
        - Key: Environment
          Value: !Ref EnvType
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID
          
###################################
#---------------------------------#
# Outputs Section
#---------------------------------#
###################################
Outputs:
  Ecr:
    Value: !Ref Ecr
    Export:
      Name: !Sub ${AWS::StackName}-ECR
