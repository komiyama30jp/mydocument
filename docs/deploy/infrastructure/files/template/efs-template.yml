###################################
#---------------------------------#
# Parameters Section
#---------------------------------#
###################################            
Parameters:
  SystemId:
    Type: String
    Description: Enter your system id.
    MinLength: 6
    MaxLength: 6
  EnvType:
    Type: String
    Description: Select the environment.
    AllowedValues:
      - t
      - k
      - v
      - e
      - i
      - s
      - m
      - p
  BillingID:
    Type: String
    Description: Enter the BillingID.

  # EFS Config
  FileSystemName:
    Type: String
    Description: Enter the efs name.
  ThroughputMode:
    Type: String
    Default: elastic
    AllowedValues: 
      - bursting
      - provisioned
      - elastic
    Description: The throughput mode of the file system. 
  ProvisionedThroughputInMibps:
    Type: Number
    Default: 1
    Description: Enter the Number(1-1024 MiB) of the ProvisionedThroughputInMibps [Thrughput mode provisioned]. 
  TaskRoleName:
    Type: String
    Description: Enter your IAM Role(TaskRole) name to allow access to efs.
    MinLength: 1

  AccessPointEnabled:
    Type: String
    Default: true
    AllowedValues: 
      - true
      - false
  AccessPointUid:
    Type: String
    Default: 5001
  AccessPointGid:
    Type: String
    Default: 500

  # Backup Config
  AWSBackupEnabled:
    Type: String
    Default: false
    AllowedValues: 
      - false
      - true
  BackupTime:
    Type: String
    Description: 'Specifies the hour when AWS Backup initiates a backup job.(cron)'
    Default: cron(0 2 * * ? *)
  TimeZone:
    Type: String
    Default: Asia/Tokyo
  DeleteAfterDays:
    Type: Number
    Default: 31
    Description: Specifies the number of days after creation that a recovery point is deleted

  # sercurity group
  SecurityGroupIds:
    Description: Select the Security Group IDs for resources
    Type: List<AWS::EC2::SecurityGroup::Id>
    MinLength: 1

  # kms key
  KMSKeyArn:
    Type: String
    Description: Note! For accounts located in the Security Data OU, please enter the arn of your customer key arn.
    AllowedPattern: ^(arn:aws:kms:.*:(\d{12})?:(key|alias)/.+|)\Z

###################################
#---------------------------------#
# Conditions Section
#---------------------------------#
###################################   
Conditions:
  IsAWSBackupEnabled:
    !Equals [true,!Ref AWSBackupEnabled]
  IsThroughputModeProvisioned:
    !Equals [!Ref ThroughputMode, 'provisioned']
  IsAccessPointEnabled:
    !Equals [true,!Ref AccessPointEnabled]
  EncryptionByKMS: 
    !Not [!Equals [!Ref KMSKeyArn, '']]

###################################
#---------------------------------#
# Resources Section
#---------------------------------#
###################################    
Resources:
  FileSystem:
    Type: AWS::EFS::FileSystem
    Properties: 
      Encrypted: !If
        - EncryptionByKMS
        - true
        - false
      FileSystemPolicy: 
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:role/${TaskRoleName}"
            Action:
              - 'elasticfilesystem:ClientRootAccess'
              - 'elasticfilesystem:ClientMount'
              - 'elasticfilesystem:ClientWrite'
              - 'elasticfilesystem:DescribeMountTargets'
              - 'elasticfilesystem:DescribeFileSystems'
      ThroughputMode: !Ref ThroughputMode
      ProvisionedThroughputInMibps: !If
        - IsThroughputModeProvisioned
        - !Ref ProvisionedThroughputInMibps
        - !Ref AWS::NoValue
      KmsKeyId: !If
        - EncryptionByKMS
        - !Ref KMSKeyArn
        - !Ref AWS::NoValue
      FileSystemTags:
        - Key: Name
          Value: !Ref FileSystemName
        - Key: SystemId
          Value: !Ref SystemId
        - Key: Environment
          Value: !Ref EnvType
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID

  MountTarget1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Select [ 0, !FindInMap [EnvType, !Ref EnvType, SubnetIds] ]
      SecurityGroups: !Ref SecurityGroupIds

  MountTarget2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Select [ 1, !FindInMap [EnvType, !Ref EnvType, SubnetIds] ]
      SecurityGroups: !Ref SecurityGroupIds

  MountTarget3:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Select [ 2, !FindInMap [EnvType, !Ref EnvType, SubnetIds] ]
      SecurityGroups: !Ref SecurityGroupIds
  
  AccessPointResource:
    Type: 'AWS::EFS::AccessPoint'
    Condition: IsAccessPointEnabled
    Properties:
      FileSystemId: !Ref FileSystem
      PosixUser:
        Uid: !Ref AccessPointUid
        Gid: !Ref AccessPointGid
      RootDirectory:
        CreationInfo:
          OwnerGid: !Ref AccessPointGid
          OwnerUid: !Ref AccessPointUid
          Permissions: "0755"
        Path: "/apl"
      AccessPointTags:
        - Key: Name
          Value: !Sub ${FileSystemName}-defaultAP


  BackupPlan:
    Condition: IsAWSBackupEnabled
    Type: AWS::Backup::BackupPlan
    Properties: 
      BackupPlan: 
        BackupPlanName: "EfsDailyBackupPlan"
        BackupPlanRule: 
          - RuleName: "EfsDailyBackupPlanRule"
            TargetBackupVault: !Ref BackupVault
            ScheduleExpression: !Ref BackupTime
            ScheduleExpressionTimezone: !Ref TimeZone
            StartWindowMinutes: 60
            # CompletionWindowMinutes: 10080
            Lifecycle:
              DeleteAfterDays: !Ref DeleteAfterDays

  BackupSelection:
    Condition: IsAWSBackupEnabled
    Type: AWS::Backup::BackupSelection
    Properties:
      BackupPlanId: !Ref BackupPlan
      BackupSelection:
        SelectionName: "EfsBackupResouce"
        IamRoleArn: !GetAtt AWSBackupServiceRole.Arn
        Resources:
          - !Sub "arn:aws:elasticfilesystem:${AWS::Region}:${AWS::AccountId}:file-system/${FileSystem}"

  BackupVault:
    Condition: IsAWSBackupEnabled
    Type: AWS::Backup::BackupVault
    Properties: 
      BackupVaultName: EfsBackupVault

  AWSBackupServiceRole:
    Condition: IsAWSBackupEnabled
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
        - Action: "sts:AssumeRole"
          Effect: "Allow"
          Principal:
            Service: backup.amazonaws.com
      Path: "/service-role/"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup"
        - "arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores"