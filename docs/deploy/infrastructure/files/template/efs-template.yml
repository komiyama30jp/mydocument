AWSTemplateFormatVersion: '2010-09-09'
Description: EFS Construction
###################################
# --------------------------------#
# Metadata
# --------------------------------#
###################################
Metadata: 
  AWS::CloudFormation::Interface: 
    ParameterGroups: 
      - Label:
          default: Project Configuration
        Parameters:
          - SystemId
          - EnvType
          - BillingID
          - SecurityGroupIds
      - Label: 
          default: "EFS Configuration"
        Parameters:
          - FileSystemName
          - ThroughputMode
          - ProvisionedThroughputInMibps
          - TaskRoleName
          - AccessPointEnabled
          - AccessPointUid
          - AccessPointGid
      - Label: 
          default: "AWS Backup Configuration"
        Parameters:
          - AWSBackupEnabled
          - BackupTime
          - TimeZone
          - DeleteAfterDays
      - Label:
          default: KMS Configuration
        Parameters:
          - KMSKeyArn

