AWSTemplateFormatVersion: '2010-09-09'
Description: 'Batch-job construction.'
###################################
# --------------------------------#
# Metadata
# --------------------------------#
###################################
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Project Configuration"
        Parameters:
          - SystemId
          - EnvType
          - BillingID
          - SecurityGroupIds

      - Label:
          default: "Cluster Configuration"
        Parameters:
          - ClusterNameSuffix

      - Label:
          default: "Batch Configuration"
        Parameters:
          - BatchNameSuffix
          - ContainerImageUri
          - TaskCpu
          - TaskMemory

      - Label:
          default: "S3 Configuration"
        Parameters:
          - BucketNameSuffix

      - Label:
          default: "Scheduler Configuration"
        Parameters:
          - ScheduleState
          - ScheduleCronExpression
          - ScheduleTimezone
          - SchedulerInputJson

      - Label:
          default: "Logs Configuration"
        Parameters:
          - LogsRetentionInDays

      - Label:
          default: "KMS Configuration"
        Parameters:
          - KMSKeyArn

###################################
#---------------------------------#
# Mappings Section
#---------------------------------#
###################################
Mappings:
  EnvType:
    t:
      EnvDiv: dev
      VpcId: vpc-0ce3d06582237bf4e
      SubnetIds: 
        - subnet-08d7e4edc502d4f3e
        - subnet-0f45e8713b99a43e5
        - subnet-0fdd903190ab25f54
    k:
      EnvDiv: dev
      VpcId: vpc-0ce3d06582237bf4e
      SubnetIds: 
        - subnet-08d7e4edc502d4f3e
        - subnet-0f45e8713b99a43e5
        - subnet-0fdd903190ab25f54
    v:
      EnvDiv: dev
      VpcId: vpc-0ce3d06582237bf4e
      SubnetIds: 
        - subnet-08d7e4edc502d4f3e
        - subnet-0f45e8713b99a43e5
        - subnet-0fdd903190ab25f54
    e:
      EnvDiv: dev
      VpcId: vpc-0ce3d06582237bf4e
      SubnetIds: 
        - subnet-08d7e4edc502d4f3e
        - subnet-0f45e8713b99a43e5
        - subnet-0fdd903190ab25f54
    i:
      EnvDiv: dev
      VpcId: vpc-0ce3d06582237bf4e
      SubnetIds: 
        - subnet-08d7e4edc502d4f3e
        - subnet-0f45e8713b99a43e5
        - subnet-0fdd903190ab25f54
    s:
      EnvDiv: dev
      VpcId: vpc-0ce3d06582237bf4e
      SubnetIds: 
        - subnet-08d7e4edc502d4f3e
        - subnet-0f45e8713b99a43e5
        - subnet-0fdd903190ab25f54
    m:
      EnvDiv: prd
      VpcId: vpc-0f45a573cbab26100
      SubnetIds: 
        - subnet-03d6798e8fe508470
        - subnet-09cea85b4f2cfec8e
        - subnet-0cc5f30d668513fb2
    p:
      EnvDiv: prd
      VpcId: vpc-0f45a573cbab26100
      SubnetIds: 
        - subnet-03d6798e8fe508470
        - subnet-09cea85b4f2cfec8e
        - subnet-0cc5f30d668513fb2

###################################
#---------------------------------#
# Parameters Section
#---------------------------------#
###################################
Parameters:
  SystemId:
    Type: String
    Description: Enter the system id.
    MinLength: 6
    MaxLength: 6
  EnvType:
    Type: String
    Description: Select the environment.
    AllowedValues:
      - t
      - k
      - v
      - e
      - i
      - s
      - m
      - p
  BillingID:
    Type: String
    Description: Enter the system BillingID.

  # sercurity group
  SecurityGroupIds:
    Description: Select the Security Group ID for resources
    Type: List<AWS::EC2::SecurityGroup::Id>
    MinLength: 1

  # Cluster Configuration
  ClusterNameSuffix:
    Type: String
    Description: Enter the ECS cluster name suffix.
    Default: bat01

  # Batch Configuration
  BatchNameSuffix:
    Type: String
    Description: Enter the batch name suffix.
    Default: batch01
  ContainerImageUri:
    Type: String
    Description: Enter the ECR image URI.
    AllowedPattern: ^\d{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com\/.*$
    ConstraintDescription: Must be a valid ECR image URI (ex. 123456789012.dkr.ecr.ap-northeast-1.amazonaws.com/repo-name:latest).

  TaskCpu:
    Type: String
    Default: "512"
    AllowedValues:
      - "256"
      - "512"
      - "1024"
      - "2048"
      - "4096"
    Description: Select the CPU units for Fargate task.
  TaskMemory:
    Type: String
    Default: "1024"
    AllowedValues:
      - "512"
      - "1024"
      - "2048"
      - "4096"
      - "8192"
      - "16384"
    Description: Select the Memory (MiB) for Fargate task.

  # S3 Configuration
  BucketNameSuffix:
    Type: String
    Description: Enter the bucket name suffix(ex. fsv-batch).
    Default: fsv-batch

  # Scheduler Configuration
  ScheduleCronExpression:
    Type: String
    Description: Enter the cron expression(Asia/Tokyo).
    Default: "cron(0 3 * * ? *)"
  ScheduleTimezone:
    Type: String
    Description: Enter the timezone(ex. Asia/Tokyo).
    Default: "Asia/Tokyo"
  ScheduleState:
    Type: String
    Description: Select the initial state of the schedule.
    Default: "DISABLED"
    AllowedValues:
      - "ENABLED"
      - "DISABLED"
  SchedulerInputJson:
    Type: String
    Default: '{ "containerOverrides": [ { "name": "batch01", "command": ["daily_report"] } ] }'
    Description: 'JSON payload for ECS RunTask. Ensure "name" matches BatchNameSuffix parameter.'

  # Logs Configuration
  LogsRetentionInDays:
    Type: Number
    Description: Enter your cloudwatch logs retention in days.
    Default: 30

  # KMS Configuration
  KMSKeyArn:
    Type: String
    Description: Note! For accounts located in the Security Data OU, please enter the arn of your customer key arn.
    AllowedPattern: ^(arn:aws:kms:.*:(\d{12})?:(key|alias)/.+|)\Z
    Default: ""

###################################
#---------------------------------#
# Conditions Section
#---------------------------------#
###################################
Conditions:
  UseKMSKey: !Not [!Equals [!Ref KMSKeyArn, ""]]
  HasSchedulerInput: !Not [!Equals [!Ref SchedulerInputJson, ""]]

###################################
#---------------------------------#
# Resources Section
#---------------------------------#
###################################
Resources:

  # ---------------------------------
  # S3 Bucket
  # ---------------------------------
  BatchS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "s3-${EnvType}-${SystemId}-${BucketNameSuffix}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              !If
              - UseKMSKey
              - 
                KMSMasterKeyID: !Ref KMSKeyArn
                SSEAlgorithm: 'aws:kms'
              - 
                SSEAlgorithm: AES256
      Tags:
        - Key: SystemId
          Value: !Ref SystemId
        - Key: Environment
          Value: !Ref EnvType
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID

  # ---------------------------------
  # EventBridge Scheduler
  # ---------------------------------
  ECSBatchSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "ebschdlr-${EnvType}-${SystemId}-${BatchNameSuffix}"
      Description: !Sub "Schedule for ECS task: ecs-task-${EnvType}-${SystemId}-${BatchNameSuffix}"
      State: !Ref ScheduleState
      ScheduleExpression: !Ref ScheduleCronExpression
      ScheduleExpressionTimezone: !Ref ScheduleTimezone
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ECSCluster.Arn
        RoleArn: !GetAtt EventBridgeScheduleRole.Arn
        EcsParameters:
          TaskDefinitionArn: !Ref ECSTaskDefinition
          LaunchType: "FARGATE"
          PlatformVersion: "LATEST"
          TaskCount: 1
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: "DISABLED"
              Subnets: !FindInMap [EnvType, !Ref EnvType, SubnetIds]
              SecurityGroups: !Ref SecurityGroupIds
        Input: !If
          - HasSchedulerInput
          - !Ref SchedulerInputJson
          - !Ref "AWS::NoValue"
        RetryPolicy:
          MaximumEventAgeInSeconds: 86400
          MaximumRetryAttempts: 2

  # ---------------------------------
  # CloudWatchLogs
  # ---------------------------------
  ECSLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/ecs-task-${EnvType}-${SystemId}-${BatchNameSuffix}"
      RetentionInDays: !Ref LogsRetentionInDays
      KmsKeyId: !If [UseKMSKey, !Ref KMSKeyArn, !Ref "AWS::NoValue"]
      Tags:
        - Key: SystemId
          Value: !Ref SystemId
        - Key: Environment
          Value: !Ref EnvType
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID

  # ---------------------------------
  # ECS Cluster
  # ---------------------------------
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "ecs-cluster-${EnvType}-${SystemId}-${ClusterNameSuffix}"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Configuration:
        ExecuteCommandConfiguration:
          Logging: DEFAULT
      Tags:
        - Key: Name
          Value: !Sub "ecs-cluster-${EnvType}-${SystemId}-${ClusterNameSuffix}"
        - Key: SystemId
          Value: !Ref SystemId
        - Key: Environment
          Value: !Ref EnvType
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID

  # ---------------------------------
  # ECS TaskDefinition
  # ---------------------------------
  ECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "ecs-task-${EnvType}-${SystemId}-${BatchNameSuffix}"
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt BatchTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt BatchTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        # Main Application Container
        - Name: !Ref BatchNameSuffix
          Image: !Ref ContainerImageUri
          Essential: true
          Environment: []
          PortMappings: []
          MountPoints: []
          VolumesFrom: []
          SystemControls: []
          LogConfiguration:
            LogDriver: awsfirelens
            # OptionsはFluentBitの設定ファイル側で制御するため指定なし
        
        # FluentBit (FireLens) Container
        - Name: firelens
          Image: 533994313413.dkr.ecr.ap-northeast-1.amazonaws.com/ecr-pub-p-ccntnr-fluentbit:latest
          Essential: true
          FirelensConfiguration:
            Type: fluentbit
            Options:
              config-file-type: file
              config-file-value: /fluent-bit/fluent-bit-custom.conf
          HealthCheck:
            Command:
              - CMD-SHELL
              - "echo '{\"health\": \"check\"}' | nc 127.0.0.1 8877 || exit 1"
            Retries: 3
            Timeout: 5
            Interval: 60
          Environment:
            - Name: CONF_BUCKET_DIR
              Value: !Sub "s3-${EnvType}-${SystemId}-${BucketNameSuffix}/fluentbit/conf"
            - Name: LOG_BUCKET_NAME
              Value: !Sub "s3-${EnvType}-${SystemId}-${BucketNameSuffix}/apllog"
            - Name: LOG_GROUP_NAME
              Value: !Sub "/ecs/ecs-task-${EnvType}-${SystemId}-${BatchNameSuffix}"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ECSLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: firelens
      Tags:
        - Key: SystemId
          Value: !Ref SystemId
        - Key: Environment
          Value: !Ref EnvType
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID

  # ---------------------------------
  # IAM Role
  # ---------------------------------
  EventBridgeScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "rol-${EnvType}-${SystemId}-scheduler-${BatchNameSuffix}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AllowRunECSTask
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecs:RunTask
                Resource: !Ref ECSTaskDefinition
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt BatchTaskExecutionRole.Arn
                  - !GetAtt BatchTaskRole.Arn
      Tags:
        - Key: SystemId
          Value: !Ref SystemId
        - Key: Environment
          Value: !Ref EnvType
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID

  BatchTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "rol-${EnvType}-${SystemId}-taskexecute-${BatchNameSuffix}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: AllowRunningContainer
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter*
                  - secretsmanager:GetSecretValue
                  - kms:Decrypt
                  - s3:GetObject
                Resource: '*'
      Tags:
        - Key: SystemId
          Value: !Ref SystemId
        - Key: Environment
          Value: !Ref EnvType
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID

  BatchTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "rol-${EnvType}-${SystemId}-task-${BatchNameSuffix}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      Tags:
        - Key: SystemId
          Value: !Ref SystemId
        - Key: Environment
          Value: !Ref EnvType
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID

  BatchTaskRolePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "pol-${EnvType}-${SystemId}-${BatchNameSuffix}"
      Roles:
        - !Ref BatchTaskRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
            Resource: '*'
          - Effect: Allow
            Action:
              - s3:Get*
              - s3:*Object
              - s3:ListBucket
            Resource: 
              - !Sub "arn:aws:s3:::s3-${EnvType}-${SystemId}-${BucketNameSuffix}*"
              - !Sub "arn:aws:s3:::s3-${EnvType}-${SystemId}-log-archive*"
          - Effect: Allow
            Action:
              - logs:Create*
              - logs:Describe*
              - logs:Put*
            Resource: !GetAtt ECSLogGroup.Arn

###################################
#---------------------------------#
# Outputs Section
#---------------------------------#
###################################
Outputs:
  ClusterName:
    Value: !Ref ECSCluster
    Description: Created ECS Cluster name
    Export:
      Name: !Sub "${AWS::StackName}-ClusterName"

  ClusterArn:
    Value: !GetAtt ECSCluster.Arn
    Description: Created ECS Cluster ARN
    Export:
      Name: !Sub "${AWS::StackName}-ClusterArn"

  TaskDefinitionArn:
    Value: !Ref ECSTaskDefinition
    Description: Created ECS Task Definition ARN
    Export:
      Name: !Sub "${AWS::StackName}-TaskDefinitionArn"

  TaskDefinitionFamily:
    Value: !Sub "ecs-task-${EnvType}-${SystemId}-${BatchNameSuffix}"
    Description: Task Definition Family Name
    Export:
      Name: !Sub "${AWS::StackName}-TaskDefinitionFamily"

  S3BucketName:
    Value: !Ref BatchS3Bucket
    Description: Created S3 Bucket name
    Export:
      Name: !Sub "${AWS::StackName}-S3BucketName"

  LogGroupName:
    Value: !Ref ECSLogGroup
    Description: CloudWatch Logs LogGroup name
    Export:
      Name: !Sub "${AWS::StackName}-LogGroupName"

  LogGroupArn:
    Value: !GetAtt ECSLogGroup.Arn
    Description: CloudWatch Logs LogGroup ARN
    Export:
      Name: !Sub "${AWS::StackName}-LogGroupArn"

  ScheduleName:
    Value: !Ref ECSBatchSchedule
    Description: Created EventBridge Scheduler name
    Export:
      Name: !Sub "${AWS::StackName}-ScheduleName"

  ScheduleArn:
    Value: !GetAtt ECSBatchSchedule.Arn
    Description: EventBridge Scheduler ARN
    Export:
      Name: !Sub "${AWS::StackName}-ScheduleArn"

  ScheduleRoleArn:
    Value: !GetAtt EventBridgeScheduleRole.Arn
    Description: EventBridge Scheduler execution role ARN
    Export:
      Name: !Sub "${AWS::StackName}-ScheduleRoleArn"

  BatchTaskExecutionRoleArn:
    Value: !GetAtt BatchTaskExecutionRole.Arn
    Description: Batch Task Execution Role ARN
    Export:
      Name: !Sub "${AWS::StackName}-BatchTaskExecutionRoleArn"

  BatchTaskRoleArn:
    Value: !GetAtt BatchTaskRole.Arn
    Description: Batch Task Role ARN
    Export:
      Name: !Sub "${AWS::StackName}-BatchTaskRoleArn"