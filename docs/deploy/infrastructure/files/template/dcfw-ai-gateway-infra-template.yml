AWSTemplateFormatVersion: '2010-09-09'
Description: for AI Gateway Infrastracture
###################################
# --------------------------------#
# Metadata
# --------------------------------#
###################################
Metadata:
  AWS::CloudFormation::Interface:
    # パラメータの並び順
    ParameterGroups:
      - Label:
          default: Project Configuration
        Parameters:
          - SystemId
          - EnvType
          - BillingID
          - SecurityGroupIds
      - Label:
          default: ELB Configuration
        Parameters:
          - ACM
          - HealthCheckPath
          - Stickiness
          - IdleTimeoutSeconds
      - Label:
          default: ECS Configuration
        Parameters:
          - ServiceNameSuffix
          - ECSClusterArn
          - ContainerInsights
          - ECSContainerPort
          - ECSTaskCPUUnit
          - ECSTaskMemory
          - ECSDesiredCount
      - Label:
          default: Logs Configuration
        Parameters:
          - LogsRetentionInDays
      - Label:
          default: KMS Configuration
        Parameters:
          - KMSKeyArn

###################################
#---------------------------------#
# Mappings Section
#---------------------------------#
###################################
Mappings:
  EnvType:
    t:
      EnvDiv: dev
      VpcId: vpc-0ce3d06582237bf4e
      SubnetIds: 
        - subnet-08d7e4edc502d4f3e
        - subnet-0f45e8713b99a43e5
        - subnet-0fdd903190ab25f54
    k:
      EnvDiv: dev
      VpcId: vpc-0ce3d06582237bf4e
      SubnetIds: 
        - subnet-08d7e4edc502d4f3e
        - subnet-0f45e8713b99a43e5
        - subnet-0fdd903190ab25f54
    v:
      EnvDiv: dev
      VpcId: vpc-0ce3d06582237bf4e
      SubnetIds: 
        - subnet-08d7e4edc502d4f3e
        - subnet-0f45e8713b99a43e5
        - subnet-0fdd903190ab25f54
    e:
      EnvDiv: dev
      VpcId: vpc-0ce3d06582237bf4e
      SubnetIds: 
        - subnet-08d7e4edc502d4f3e
        - subnet-0f45e8713b99a43e5
        - subnet-0fdd903190ab25f54
    i:
      EnvDiv: dev
      VpcId: vpc-0ce3d06582237bf4e
      SubnetIds: 
        - subnet-08d7e4edc502d4f3e
