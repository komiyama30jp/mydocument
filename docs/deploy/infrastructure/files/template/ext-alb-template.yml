AWSTemplateFormatVersion: '2010-09-09'
Description: for internetALB and TG
###################################
# --------------------------------#
# Metadata
# --------------------------------#
###################################
Metadata:
  AWS::CloudFormation::Interface:
    # パラメータの並び順
    ParameterGroups:
      - Label:
          default: Project Configuration
        Parameters:
          - SystemId
          - EnvType
          - BillingID
          - SecurityGroupIds
      - Label:
          default: ELB Configuration
        Parameters:
          - ACM
          - ServiceNameSuffix
          - ExContainerPort
          - ExtHealthCheckPath
          - Stickiness
          - IdleTimeoutSeconds
          - PathPattern


###################################
#---------------------------------#
# Mappings Section
#---------------------------------#
###################################
