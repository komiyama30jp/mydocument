###################################
#---------------------------------#
# Parameters Section
#---------------------------------#
###################################
Parameters:
  SystemId:
    Type: String
    Description: Enter the system id.
    MinLength: 6
    MaxLength: 6
  EnvType:
    Type: String
    Description: Select the environment.
    AllowedValues:
      - t
      - k
      - v
      - e
      - i
      - s
      - m
      - p
  BillingID:
    Type: String
    Description: Enter the system billing id.

  # sercurity group
  SecurityGroupIds:
    Description: Select the Security Group IDs for resources
    Type: List<AWS::EC2::SecurityGroup::Id>
    MinLength: 1

  # ACM(certificate)
  ACM:
    Type: String
    Description: Enter your elb domain certificate arn
    AllowedPattern: arn:aws:acm:[\w+=/,.@-]*:[0-9]+:certificate/(.*)

  # servicename(ap)
  ServiceNameSuffix:
    Description: Enter the aplicationserver service name.
    Type: String
    Default: tom01

  # port(ap)
  ExContainerPort:
    Type: String
    Description: Enter the aplicationserver container port
    Default: '31100'

  # healthcheck(ap)
  ExtHealthCheckPath:
    Description: Enter the path respond to health checks from ALB.
    Type: String
    Default: /mngcheck

  # Sticky Session
  Stickiness:
    Description: Select the ALB Stickiness to enable.
    Type: String
    Default: true

  # idletimeout
  IdleTimeoutSeconds:
    Description: 'Enter the ALB idle timeout seconds. (default: 360)'
    Type: String
    Default: 360

  #path-pattern
  # ListnerRule path-pattern
  PathPattern:
    Description: Note! Enter the path respond to ListnerRule from ALB.
    Type: String
    AllowedPattern: '^([^,]+)(,[^,]+){0,4}$'
    ConstraintDescription: 'Specify 1 to 5 path patterns separated by commas.'


###################################
#---------------------------------#
# Resources Section
#---------------------------------#
###################################          
Resources:
  # ---------------------------------
  # Target Groups
  # ---------------------------------
  ExtALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn: ExternalALB
    Properties:
      Name: !Sub alb-tg-${EnvType}-${SystemId}-ext-${ServiceNameSuffix}
      TargetType: ip
      Protocol: HTTP
      Port: !Ref ExContainerPort
      VpcId: !FindInMap [EnvType, !Ref EnvType, VpcId]
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Ref ExtHealthCheckPath
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckTimeoutSeconds: 5
      HealthCheckIntervalSeconds: 10
      TargetGroupAttributes:
        - Key: stickiness.enabled
          Value: !Ref Stickiness
        - Key: deregistration_delay.timeout_seconds
          Value: 110
      Tags:
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID
  
  # ---------------------------------
  # Elastic Load Balancer
  # ---------------------------------
  ExternalALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Name: !Sub alb-${EnvType}-${SystemId}-ext-${ServiceNameSuffix}
      Scheme: internet-facing
      LoadBalancerAttributes:
        - Key: deletion_protection.enabled
          Value: false
        - Key: idle_timeout.timeout_seconds
          Value: !Ref IdleTimeoutSeconds
        - Key: access_logs.s3.enabled
          Value: true
        - Key: access_logs.s3.bucket
          Value: s3-dwafcm-accesslog-01
        - Key: access_logs.s3.prefix
          Value: !Sub ${SystemId}/${AWS::AccountId}/alb/alb-${EnvType}-${SystemId}-ext-${ServiceNameSuffix}
      Subnets: !FindInMap [EnvType, !Ref EnvType, SubnetIds]
      SecurityGroups: !Ref SecurityGroupIds
      Tags:
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID


  # ---------------------------------
  # Listener
  # ---------------------------------
  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: 403
            ContentType: text/html
            MessageBody: "<html> <head> <title>Access Denied</title> </head> <body class=\"vsc-initialized\"> <font face=\"Helvetica\"> <big><strong></strong></big><br> </font> <blockquote> <table border=\"0\" cellpadding=\"1\" width=\"80%\"> <tbody><tr><td> <font face=\"Helvetica\"> <big>Access Denied (policy_denied)</big> <br> <br> </font> </td></tr> <tr><td> <font face=\"Helvetica\"> Your system policy has denied access to the requested URL. </font> </td></tr> <tr><td> <font face=\"Helvetica\"> </font> </td></tr> <tr><td> <font face=\"Helvetica\" size=\"2\"> <br> For assistance, contact your network support team. </font> </td></tr> </tbody></table> </blockquote> </body> </html>"
      LoadBalancerArn: !Ref ExternalALB
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref ACM


  # ---------------------------------
  # ListenerRule
  # ---------------------------------
  LisnerRuleSingle:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 10
      Actions:
      - Type: forward
        TargetGroupArn:
          !Ref ExtALBTargetGroup
      Conditions:
      - Field: path-pattern
        Values: !Split [",", !Ref PathPattern]


###################################
# --------------------------------#
# Output parameters
# --------------------------------#
###################################
Outputs:
  ExternalALBArn:
    Value: !Ref ExternalALB
    Export:
      Name: !Sub ${AWS::StackName}-ExternalALBArn
  ExternalALBName:
    Value: !GetAtt ExternalALB.LoadBalancerName
  ExtALBTargetGroupArn:
    Value: !Ref ExtALBTargetGroup
    Export:
      Name: !Sub ${AWS::StackName}-ExtALBTargetGroupArn
  ExtALBTargetGroupName:
    Value: !GetAtt ExtALBTargetGroup.TargetGroupName

