AWSTemplateFormatVersion: '2010-09-09'
Description: for Tomcat(MPA) Infrastracture
###################################
# --------------------------------#
# Metadata
# --------------------------------#
###################################
Metadata:
  AWS::CloudFormation::Interface:
    # パラメータの並び順
    ParameterGroups:
      - Label:
          default: Project Configuration
        Parameters:
          - SystemId
          - EnvType
          - BillingID
          - SecurityGroupIds
      - Label:
          default: ELB Configuration
        Parameters:
          - ACM
          - TomHealthCheckPath
          - Stickiness
          - IdleTimeoutSeconds
      - Label:
          default: ECS Configuration
        Parameters:
          - ClusterNameSuffix
          - ContainerInsights
          - TomServiceNameSuffix
          - TomContainerPort
          - TomECSTaskCPUUnit
          - TomECSTaskMemory
          - TomDesiredCount
      - Label:
          default: S3 Configuration
        Parameters:
          - BucketNameSuffix
      - Label:
          default: Logs Configuration
        Parameters:
          - LogsRetentionInDays
      - Label:
          default: KMS Configuration
        Parameters:
          - KMSKeyArn

###################################
#---------------------------------#
# Mappings Section
#---------------------------------#
###################################
Mappings:
  EnvType:
    t:
      EnvDiv: dev
      VpcId: vpc-0ce3d06582237bf4e
      SubnetIds: 
        - subnet-08d7e4edc502d4f3e
        - subnet-0f45e8713b99a43e5
        - subnet-0fdd903190ab25f54
    k:
      EnvDiv: dev
      VpcId: vpc-0ce3d06582237bf4e
      SubnetIds: 
        - subnet-08d7e4edc502d4f3e
        - subnet-0f45e8713b99a43e5
        - subnet-0fdd903190ab25f54
    v:
      EnvDiv: dev
      VpcId: vpc-0ce3d06582237bf4e
      SubnetIds: 
        - subnet-08d7e4edc502d4f3e
        - subnet-0f45e8713b99a43e5
        - subnet-0fdd903190ab25f54
    e:
      EnvDiv: dev
      VpcId: vpc-0ce3d06582237bf4e
      SubnetIds: 
        - subnet-08d7e4edc502d4f3e
        - subnet-0f45e8713b99a43e5
        - subnet-0fdd903190ab25f54
    i:
      EnvDiv: dev
      VpcId: vpc-0ce3d06582237bf4e
      SubnetIds: 
        - subnet-08d7e4edc502d4f3e
        - subnet-0f45e8713b99a43e5
        - subnet-0fdd903190ab25f54
    s:
      EnvDiv: dev
      VpcId: vpc-0ce3d06582237bf4e
      SubnetIds: 
        - subnet-08d7e4edc502d4f3e
        - subnet-0f45e8713b99a43e5
        - subnet-0fdd903190ab25f54
    m:
      EnvDiv: prd
      VpcId: vpc-0f45a573cbab26100
      SubnetIds: 
        - subnet-03d6798e8fe508470
        - subnet-09cea85b4f2cfec8e
        - subnet-0cc5f30d668513fb2
    p:
      EnvDiv: prd
      VpcId: vpc-0f45a573cbab26100
      SubnetIds: 
        - subnet-03d6798e8fe508470
        - subnet-09cea85b4f2cfec8e
        - subnet-0cc5f30d668513fb2

#  TomECSTaskMemory:
  TomECSTaskMemory:
    '2048':
      HardLimit: 1536
    '4096':
      HardLimit: 3584
    '8192':
      HardLimit: 7680

###################################
#---------------------------------#
# Parameters Section
#---------------------------------#
###################################
Parameters:
  SystemId:
    Type: String
    Description: Enter the system id.
    MinLength: 6
    MaxLength: 6
  EnvType:
    Type: String
    Description: Select the environment.
    AllowedValues:
      - t
      - k
      - v
      - e
      - i
      - s
      - m
      - p
  BillingID:
    Type: String
    Description: Enter the system billing id.

  # sercurity group
  SecurityGroupIds:
    Description: Select the Security Group IDs for resources
    Type: List<AWS::EC2::SecurityGroup::Id>
    MinLength: 1

  # ACM(certificate)
  ACM:
    Type: String
    Description: Enter your elb domain certificate arn
    AllowedPattern: arn:aws:acm:[\w+=/,.@-]*:[0-9]+:certificate/(.*)

  # healthcheck(tom)
  TomHealthCheckPath:
    Description: Enter the path respond to health checks from ALB.
    Type: String
    Default: /mngcheck

  # Sticky Session
  Stickiness:
    Description: Select the ALB Stickiness to enable.
    Type: String
    Default: true

  # idletimeout
  IdleTimeoutSeconds:
    Description: 'Enter the ALB idle timeout seconds. (default: 360)'
    Type: String
    Default: 360

  # Cluster Name
  ClusterNameSuffix:
    Type: String
    Description: Enter the ecs cluster name
    Default: apl01
  
  # Cluster ContainerInsights
  ContainerInsights:
    Type: String
    Description: Select the ContainerInsights enabled or disabled
    Default: enabled
    AllowedValues:
      - enhanced
      - enabled
      - disabled

  # Tomcat
  # servicename(tom)
  TomServiceNameSuffix:
    Description: Enter the tomcat service name.
    Type: String
    Default: tom01
  TomContainerPort:
    Type: String
    Description: Enter the tomcat container port
    Default: '31100'
  TomECSTaskCPUUnit:
    AllowedValues:
      - 1024
      - 2048
      - 4096
    Type: String
    Default: 2048
  TomECSTaskMemory:
    AllowedValues:
      - 2048
      - 4096
      - 8192
    Type: String
    Default: 4096
  TomDesiredCount:
    Type: String
    Description: For recommended values,set 1 for non-production env and 2 for production or equivalent env. if necessary,set it to 2 or higher.
    Default: 1
  
  # s3
  BucketNameSuffix:
    Type: String
    Description: Enter your bucket name:s3-(EnvType)-(SystemId)-(BucketNameSuffix).
    Default: fsv-01
  
  # logs
  LogsRetentionInDays:
    Type: Number
    Description: Enter your cloudwatch logs retention in days.
    Default: 30

  # alias kms key
  KMSKeyArn:
    Type: String
    Description: Note! For accounts located in the Security Data OU, please enter the arn of your customer key arn.
    AllowedPattern: ^(arn:aws:kms:.*:(\d{12})?:(key|alias)/.+|)\Z
    MinLength: 0
  
###################################
#---------------------------------#
# Conditions Section
#---------------------------------#
###################################   
Conditions:
  EncryptionByKMS: 
    !Not [!Equals [ !Ref KMSKeyArn, '']] 

###################################
#---------------------------------#
# Resources Section
#---------------------------------#
###################################          
Resources:
  # ---------------------------------
  # Target Groups
  # ---------------------------------
  TomALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn: InternalALB
    Properties:
      Name: !Sub alb-tg-${EnvType}-${SystemId}-int-${TomServiceNameSuffix}
      TargetType: ip
      Protocol: HTTP
      Port: !Ref TomContainerPort
      VpcId: !FindInMap [EnvType, !Ref EnvType, VpcId]
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Ref TomHealthCheckPath
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckTimeoutSeconds: 5
      HealthCheckIntervalSeconds: 10
      TargetGroupAttributes:
        - Key: stickiness.enabled
          Value: !Ref Stickiness
        - Key: deregistration_delay.timeout_seconds
          Value: 110
      Tags:
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID
  
  # ---------------------------------
  # Elastic Load Balancer
  # ---------------------------------
  InternalALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Name: !Sub alb-${EnvType}-${SystemId}-int-${TomServiceNameSuffix}
      Scheme: internal
      LoadBalancerAttributes:
        - Key: deletion_protection.enabled
          Value: false
        - Key: idle_timeout.timeout_seconds
          Value: !Ref IdleTimeoutSeconds
        - Key: access_logs.s3.enabled
          Value: true
        - Key: access_logs.s3.bucket
          Value: s3-dwafcm-accesslog-01
        - Key: access_logs.s3.prefix
          Value: !Sub ${SystemId}/${AWS::AccountId}/alb/alb-${EnvType}-${SystemId}-int-${TomServiceNameSuffix}
      Subnets: !FindInMap [EnvType, !Ref EnvType, SubnetIds]
      SecurityGroups: !Ref SecurityGroupIds
      Tags:
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID
        - Key: FMSWebACL
          Value: disabled

  # ---------------------------------
  # Listener
  # ---------------------------------
  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TomALBTargetGroup
      LoadBalancerArn: !Ref InternalALB
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref ACM

  # ---------------------------------
  # ECS Task IAM
  # ---------------------------------
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: AllowRunningContainer
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter*
                  - secretsmanager:GetSecretValue
                  - kms:Decrypt
                  - s3:GetObject
                Resource: '*'
      RoleName: !Sub rol-${EnvType}-${SystemId}-taskexecute
      Tags:
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID

  TomTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      RoleName: !Sub rol-${EnvType}-${SystemId}-task-${TomServiceNameSuffix}
      Tags:
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID

  TomTaskRolePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub pol-${EnvType}-${SystemId}-${TomServiceNameSuffix}
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
            Resource: '*'
          - Effect: Allow
            Action:
              - s3:Get*
              - s3:*Object
              - s3:ListBucket
            Resource: 
              - !Sub arn:aws:s3:::s3-${EnvType}-${SystemId}-${BucketNameSuffix}*
              - !Sub arn:aws:s3:::s3-${EnvType}-${SystemId}-log-archive*
          - Effect: Allow
            Action:
              - logs:Create*
              - logs:Describe*
              - logs:Put*
            Resource: !GetAtt TomECSLogGroup.Arn
      Roles:
        - !Ref TomTaskRole

  # ---------------------------------
  # ECS TaskDefinition
  # ---------------------------------
  # only initial construction

  TomECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      ContainerDefinitions:
        - Image: 533994313413.dkr.ecr.ap-northeast-1.amazonaws.com/ecr-pub-p-ccntnr-tomcat:latest
          LogConfiguration:
            LogDriver: awsfirelens
          Name: tomcat
          Memory: !FindInMap [TomECSTaskMemory, !Ref TomECSTaskMemory, HardLimit]
          PortMappings:
            - ContainerPort: !Ref TomContainerPort
              HostPort: !Ref TomContainerPort
          Environment:
            - Name: JAVA_OPTS
              Value: '-XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=70.0'
        - Image: 533994313413.dkr.ecr.ap-northeast-1.amazonaws.com/ecr-pub-p-ccntnr-fluentbit:latest
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub /ecs/ecs-task-${EnvType}-${SystemId}-${TomServiceNameSuffix}
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: 'firelens'
          Name: firelens
          FirelensConfiguration:
            Type: 'fluentbit'
            Options:
              config-file-type: 'file'
              config-file-value: '/fluent-bit/fluent-bit-custom.conf'
          Environment:
            - Name: CONF_BUCKET_DIR
              Value: !Sub s3-${EnvType}-${SystemId}-${BucketNameSuffix}/fluentbit/conf
            - Name: LOG_BUCKET_NAME
              Value: !Sub s3-${EnvType}-${SystemId}-${BucketNameSuffix}/apllog
            - Name: LOG_GROUP_NAME
              Value: !Sub /ecs/ecs-task-${EnvType}-${SystemId}-${TomServiceNameSuffix}
      Cpu: !Ref TomECSTaskCPUUnit
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      Family: !Sub ecs-task-${EnvType}-${SystemId}-${TomServiceNameSuffix}
      Memory: !Ref TomECSTaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      TaskRoleArn: !GetAtt TomTaskRole.Arn
      Tags:
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID

  # ---------------------------------
  # ECS Cluster
  # ---------------------------------
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      CapacityProviders:
        - FARGATE
      ClusterName: !Sub ecs-cluster-${EnvType}-${SystemId}-${ClusterNameSuffix}
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
      ClusterSettings:
        - Name : containerInsights
          Value : !Ref ContainerInsights
      Tags:
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID

  # ---------------------------------
  # ECS Service
  # ---------------------------------
  TomECSService:
    Type: AWS::ECS::Service
    DependsOn:
      - TomECSTaskDefinition
      - ALBListener
    Properties:
      Cluster: !Ref ECSCluster
      DesiredCount: !Ref TomDesiredCount
      EnableExecuteCommand: true
      LoadBalancers:
        - ContainerName: tomcat
          ContainerPort: !Ref TomContainerPort
          TargetGroupArn: !Ref TomALBTargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups: !Ref SecurityGroupIds
          Subnets: !FindInMap [EnvType, !Ref EnvType, SubnetIds]
      ServiceName: !Sub ecs-service-${EnvType}-${SystemId}-${TomServiceNameSuffix}
      TaskDefinition: !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/ecs-task-${EnvType}-${SystemId}-${TomServiceNameSuffix}
      PropagateTags: SERVICE
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      Tags:
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID

  #---------------------------------#
  # S3
  #---------------------------------#
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub s3-${EnvType}-${SystemId}-${BucketNameSuffix}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              !If
              - EncryptionByKMS
              - 
                KMSMasterKeyID: !Ref KMSKeyArn
                SSEAlgorithm: 'aws:kms'
              - 
                SSEAlgorithm: AES256
      Tags:
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID
  
  # ---------------------------------
  # CloudWatchLogs
  # ---------------------------------
  TomECSLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId:
        !If
        - EncryptionByKMS
        - !Ref KMSKeyArn
        - !Ref AWS::NoValue
      LogGroupName: !Sub /ecs/ecs-task-${EnvType}-${SystemId}-${TomServiceNameSuffix}
      RetentionInDays: !Ref LogsRetentionInDays
      Tags:
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID


###################################
# --------------------------------#
# Output parameters
# --------------------------------#
###################################
Outputs:
  InternalALBArn:
    Value: !Ref InternalALB
    Export:
      Name: !Sub ${AWS::StackName}-InternalALBArn
  InternalALBName:
    Value: !GetAtt InternalALB.LoadBalancerName
  TomALBTargetGroupArn:
    Value: !Ref TomALBTargetGroup
    Export:
      Name: !Sub ${AWS::StackName}-TomALBTargetGroupArn
  TomALBTargetGroupName:
    Value: !GetAtt TomALBTargetGroup.TargetGroupName
  ECSCluster:
    Value: !Ref ECSCluster
    Export:
      Name: !Sub ${AWS::StackName}-ECSCluster
