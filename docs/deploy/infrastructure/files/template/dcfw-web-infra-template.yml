AWSTemplateFormatVersion: '2010-09-09'
Description: Web Infrastracture (based on DC Framework) Construction
###################################
# --------------------------------#
# Metadata
# --------------------------------#
###################################
Metadata:
  AWS::CloudFormation::Interface:
    # パラメータの並び順
    ParameterGroups:
      - Label:
          default: Project Configuration
        Parameters:
          - SystemId
          - EnvType
          - BillingID
          - SecurityGroupIds
      - Label:
          default: ELB Configuration
        Parameters:
          - ACM
          - WebHealthCheckPath
          - Stickiness
          - IdleTimeoutSeconds
      - Label:
          default: ELB OIDC Configuration
        Parameters:
          - OIDCIssuerURL
          - OIDCAuthorizationEndpoint
          - OIDCTokenEndpoint
          - OIDCUserInfoEndpoint
          - OIDCClientID
          - OIDCClientSecret
          - OIDCScope
          - OIDCAuthExclusionHeader
          - OIDCAuthExclusionPath
          - OIDCAuthExclusionHealthCheckPath
      - Label:
          default: ECS Configuration
        Parameters:
          - NamespaceId
          - ClusterNameSuffix
          - ContainerInsights
          - WebServiceNameSuffix
          - WebContainerPort
          - WebECSTaskCPUUnit
          - WebECSTaskMemory
          - WebDesiredCount
          - ApiServiceNameSuffix
          - ApiContainerPort
          - ApiECSTaskCPUUnit
          - ApiECSTaskMemory
          - ApiHealthCheckPath
          - ApiDesiredCount
      - Label:
          default: Cache(Redis/Valkey) Common Configuration
        Parameters:
          - CacheEnabled
          - CacheEngine
          - CacheMode
          - CacheNameSuffix
          - CachePort
          - CacheNodeVersion
      - Label:
          default: Cache(Redis/Valkey) Serverless Configuration
        Parameters:
          - CacheMaxCapacityECPU
          - CacheMaxCapacityMemory
      - Label:
          default: Cache(Redis/Valkey) Provisioned Configuration
        Parameters:
          - CacheNodeType
          - CacheReplicaNodeNum
          - CacheParameterGroupName
      - Label:
          default: S3 Configuration
        Parameters:
          - BucketNameSuffix
      - Label:
          default: Logs Configuration
        Parameters:
          - LogsRetentionInDays
      - Label:
          default: KMS Configuration
        Parameters:
          - KMSKeyArn

###################################
#---------------------------------#
# Mappings Section
#---------------------------------#
###################################
