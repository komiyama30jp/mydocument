###################################
#---------------------------------#
# Parameters Section
#---------------------------------#
###################################
Parameters:
  SystemId:
    Type: String
    Description: Enter the system id.
    MinLength: 6
    MaxLength: 6
  EnvType:
    Type: String
    Description: Select the environment.
    AllowedValues:
      - t
      - k
      - v
      - e
      - i
      - s
      - m
      - p
  BillingID:
    Type: String
    Description: Enter the BillingID.

  # sercurity group
  SecurityGroupIds:
    Description: Select the Security Group IDs for resources
    Type: List<AWS::EC2::SecurityGroup::Id>
    MinLength: 1

  # service discovery
  NamespaceId:
    Type: String
    Description: Enter your vpc namespace(ns-xxxxxxxxxxx)
    AllowedPattern: ns-(.*)
    MinLength: 1

  # ALB
  ACM:
    Type: String
    Description: Enter your elb domain certificate arn
    AllowedPattern: arn:aws:acm:[\w+=/,.@-]*:[0-9]+:certificate/(.*)  
  WebHealthCheckPath:
    Description: Enter the path respond to health checks from ALB.
    Type: String
    Default: /health
  Stickiness:
    Description: Select the ALB Stickiness to enable.
    Type: String
    Default: false
  IdleTimeoutSeconds:
    Description: 'Enter the ALB idle timeout seconds. (default: 360)'
    Type: String
    Default: 360
  
  # ALB OIDC Setting
  OIDCIssuerURL:
    Type: String
    Description: Enter your OIDC provider issuer url (ex. https://${tenant}.okta.com or https://cognito-idp.ap-northeast-1.amazonaws.com/${UserPoolId})
  
  OIDCAuthorizationEndpoint:
    Type: String
    Description: Enter your OIDC provider Authorization endpoint
  
  OIDCTokenEndpoint:
    Type: String
    Description: Enter your OIDC provider Token endpoint

  OIDCUserInfoEndpoint:
    Type: String
    Description: Enter your OIDC provider UserInfo endpoint

  OIDCClientID:
    Type: String
    Description: Enter your OIDC App Client ID
  
  OIDCClientSecret:
    Type: String
    Description: Enter your OIDC App Client Secret
  
  OIDCScope:
    Type: String
    Description: Enter OIDC Scope
    Default: "openid profile"

  OIDCAuthExclusionHeader:
    Type: String
    Description: Enter OIDC auth exclusion HTTP Header for link other system (ex. Authorization).
    Default: "Authorization"
  
  OIDCAuthExclusionPath:
    Type: String
    Description: Enter OIDC auth exclusion path for link other system (ex. /api).
    Default: "/api"
  
  OIDCAuthExclusionHealthCheckPath:
    Type: String
    Description: Enter OIDC auth exclusion path for health check.
    Default: "/health"
    
  # ECS Cluster
  ClusterNameSuffix:
    Type: String
    Description: Enter the ecs cluster name
    Default: webapp
  
  ContainerInsights:
    Type: String
    Description: Select the ContainerInsights enabled or disabled
    Default: enabled
    AllowedValues:
      - enhanced
      - enabled
      - disabled

  # web
  WebServiceNameSuffix:
    Description: Enter the web service name.
    Type: String
    Default: web
  WebContainerPort:
    Type: String
    Description: Enter the web container port
    Default: '31000'
  WebECSTaskCPUUnit:
    AllowedValues:
      - 256
      - 512
      - 1024
    Type: String
    Default: 512
  WebECSTaskMemory:
    AllowedValues:
      - 512
      - 1024
      - 2048
    Type: String
    Default: 1024
  WebDesiredCount:
    Type: String
    Description: For recommended values,set 1 for non-production env and 2 for production or equivalent env. if necessary,set it to 2 or higher.
    Default: 1
  
  # api
  ApiServiceNameSuffix:
    Description: Enter the api service name.
    Type: String
    Default: api
  ApiContainerPort:
    Type: String
    Description: Enter the api container port
    Default: '8080'
  ApiECSTaskCPUUnit:
    AllowedValues:
      - 1024
      - 2048
      - 4096
    Type: String
    Default: 2048
  ApiECSTaskMemory:
    AllowedValues:
      - 2048
      - 4096
      - 8192
    Type: String
    Default: 4096
  ApiHealthCheckPath:
    Description: Enter the path respond to health checks by self.
    Type: String
    Default: /actuator/health
  ApiDesiredCount:
    Type: String
    Description: For recommended values,set 1 for non-production env and 2 for production or equivalent env. if necessary,set it to 2 or higher.
    Default: 1
  
  # Redis/Cache
  CacheEnabled:
    Type: String
    Description: Whether to build Redis/Valkey or not
    Default: false
    AllowedValues:
      - true
      - false
  
  CacheEngine:
    Type: String
    Description: Select cache engine (Valkey/Redis) 
    Default: valkey
    AllowedValues:
      - valkey
      - redis
  
  CacheMode:
    Type: String
    Default: Serverless
    AllowedValues: 
      - Serverless
      - Provisioned
    Description: Select deployment mode
  
  CacheNameSuffix:
    Type: String
    Description: Cache Name
    Default: cache
  
  CachePort:
    Type: String
    Description: Cache port
    Default: 6379

  CacheNodeVersion:
    Type: String
    Description: Cache node engine version (Serverless only major ex[9] provisioned ex[9.1])
    Default: ''

  # Serverless 用パラメータ
  CacheMaxCapacityECPU:
    Type: String
    Default: ''
    Description: Cache max capacity ecpu

  CacheMaxCapacityMemory:
    Type: String
    Default: ''
    Description: Cache max capacity memory
  
  # Provisioned 用パラメータ
  CacheNodeType:
    Type: String
    Description: Cache node type
    Default: cache.t3.medium

  CacheReplicaNodeNum:
    Type: Number
    Description: The number of cache replica nodes.
    Default: 0
    AllowedValues:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
    
  CacheParameterGroupName:
    Type: String
    Description: If u wanna specific parameter group, enter your parameter group.
  
  # s3
  BucketNameSuffix:
    Type: String
    Description: Enter your bucket name:s3-(EnvType)-(SystemId)-(BucketNameSuffix).
    Default: fsv-01

  # logs
  LogsRetentionInDays:
    Type: Number
    Description: Enter your cloudwatch logs retention in days.
    Default: 30
  
  # kms key
  KMSKeyArn:
    Type: String
    Description: Note! For accounts located in the Security Data OU, please enter the arn of your customer key arn.
    AllowedPattern: ^(arn:aws:kms:.*:(\d{12})?:(key|alias)/.+|)\Z
  
###################################
#---------------------------------#
# Conditions Section
#---------------------------------#
###################################   
Conditions:
  EncryptionByKMS: 
    !Not [!Equals [!Ref KMSKeyArn, '']]
  IsCacheEnabled:
    !Equals [true,!Ref CacheEnabled]
  IsValkey: !And
    - !Equals [ !Ref CacheEnabled, 'true' ]
    - !Equals ['valkey',!Ref CacheEngine]
  IsRedis: !And
    - !Equals [ !Ref CacheEnabled, 'true' ]
    - !Equals ['redis',!Ref CacheEngine]
  IsServerless: !And
    - !Equals [ !Ref CacheEnabled, 'true' ]
    - !Equals [ !Ref CacheMode, 'Serverless' ]
  IsProvisioned: !And
    - !Equals [ !Ref CacheEnabled, 'true' ]
    - !Equals [ !Ref CacheMode, 'Provisioned' ]
  HasServerlessMemLimit: !And
    - !Equals [ !Ref CacheEnabled, 'true' ]
    - !Not [ !Equals [ !Ref CacheMaxCapacityMemory, '' ] ]
  HasServerlessECPULimit: !And
    - !Equals [ !Ref CacheEnabled, 'true' ]
    - !Not [ !Equals [ !Ref CacheMaxCapacityECPU, '' ] ]
  HasCacheNodeVersion: 
    !Not [ !Equals [ !Ref CacheNodeVersion, '' ] ]
  HasCacheParameterGroupName:
    !Not [!Equals [!Ref CacheParameterGroupName, '']] 
  IsCacheNodeMulti:
    !Not [!Equals [!Ref CacheReplicaNodeNum, '0' ]]
  IsOIDCIssuerURLNotNull:
    !Not [!Equals [!Ref OIDCIssuerURL, '']]

###################################
#---------------------------------#
# Resources Section
#---------------------------------#
###################################          
Resources:
  # ---------------------------------
  # Target Groups
  # ---------------------------------
  WebALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn: InternalALB
    Properties:
      Name: !Sub alb-tg-${EnvType}-${SystemId}-int-${WebServiceNameSuffix}
      TargetType: ip
      Protocol: HTTP
      Port: !Ref WebContainerPort
      VpcId: !FindInMap [EnvType, !Ref EnvType, VpcId]
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Ref WebHealthCheckPath
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckTimeoutSeconds: 5
      HealthCheckIntervalSeconds: 10
      TargetGroupAttributes:
        - Key: stickiness.enabled
          Value: !Ref Stickiness
        - Key: deregistration_delay.timeout_seconds
          Value: 110
      Tags:
        - Key: SystemId
          Value: !Ref SystemId
        - Key: Environment
          Value: !Ref EnvType
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID
  
  # ---------------------------------
  # Elastic Load Balancer
  # ---------------------------------
  InternalALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Name: !Sub alb-${EnvType}-${SystemId}-int-${WebServiceNameSuffix}
      Scheme: internal
      LoadBalancerAttributes:
        - Key: deletion_protection.enabled
          Value: false
        - Key: idle_timeout.timeout_seconds
          Value: !Ref IdleTimeoutSeconds
        - Key: access_logs.s3.bucket
          Value: s3-dwafcm-accesslog-01
        - Key: access_logs.s3.prefix
          Value: !Sub ${SystemId}/${AWS::AccountId}/alb/alb-${EnvType}-${SystemId}-int-${WebServiceNameSuffix}
      Subnets: !FindInMap [EnvType, !Ref EnvType, SubnetIds]
      SecurityGroups: !Ref SecurityGroupIds
      Tags:
        - Key: SystemId
          Value: !Ref SystemId
        - Key: Environment
          Value: !Ref EnvType
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID
        - Key: FMSWebACL
          Value: disabled

  # ---------------------------------
  # Listener
  # ---------------------------------
  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - !If
          - IsOIDCIssuerURLNotNull
          - Type: fixed-response
            FixedResponseConfig: 
              ContentType: text/html
              MessageBody: |
                <HTML>
                <HEAD>
                <meta name="robots" content="noindex,nofollow,noarchive" />
                <title>ＥＳＱシステム</title>
                <STYLE TYPE="text/css">
                <!--
                body{
                  font-size: 12px;
                  font-family:"HiraginoSans-W3","Yu Gothic Medium";
                }
                // -->
                </STYLE>
                </head>
                <BODY>
                <CENTER>
                <BR>
                <BR>
                <TABLE align='center' border='0' cellspacing='10' cellpadding='0'>
                <TR>
                <TD align='center' width='100%'>アクセスエラー</TD>
                </TR>
                <TR>
                <TD align='center' width='100%'>
                For assistance, contact your support team.
                </TR>
                </TABLE>
                <BR>
                <HR size='1' >
                Copy right DENTSU INC. All rights reserved.
                </CENTER>
                </BODY>
                </html>
              StatusCode: '403'
          - Type: forward
            TargetGroupArn: !Ref WebALBTargetGroup
        
      LoadBalancerArn: !Ref InternalALB
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref ACM
  
  # ---------------------------------
  # Listener Rule
  # ---------------------------------
  ALBHealthListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: IsOIDCIssuerURLNotNull
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 98
      Conditions:
        - Field: path-pattern
          Values:
            - !Sub "*${OIDCAuthExclusionHealthCheckPath}*"
      Actions:
        - Type: forward
          TargetGroupArn: !Ref WebALBTargetGroup
  
  ALBOIDCAuthExclusionPathListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: IsOIDCIssuerURLNotNull
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 99
      Conditions:
        - Field: path-pattern
          Values:
            - !Sub ${OIDCAuthExclusionPath}*
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: !Ref OIDCAuthExclusionHeader
            Values: 
              - "*"
      Actions:
        - Type: forward
          TargetGroupArn: !Ref WebALBTargetGroup
  
  ALBOIDCListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: IsOIDCIssuerURLNotNull
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 100
      Conditions:
        - Field: path-pattern
          Values:
            - "/*"
      Actions:
        - Type: authenticate-oidc
          Order: 1
          AuthenticateOidcConfig:
            AuthorizationEndpoint: !Ref OIDCAuthorizationEndpoint
            ClientId: !Ref OIDCClientID
            ClientSecret: !Ref OIDCClientSecret
            Issuer: !Ref OIDCIssuerURL
            TokenEndpoint: !Ref OIDCTokenEndpoint
            UserInfoEndpoint: !Ref OIDCUserInfoEndpoint
            Scope: !Ref OIDCScope
            SessionCookieName: "AWSELBAuthSessionCookie"
            SessionTimeout: 3600 # seconds
            OnUnauthenticatedRequest: authenticate # or deny, allow
        - Type: forward
          Order: 2
          TargetGroupArn: !Ref WebALBTargetGroup

  # ---------------------------------
  # ECS Task IAM
  # ---------------------------------
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: AllowRunningContainer
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter*
                  - secretsmanager:GetSecretValue
                  - kms:Decrypt
                  - s3:GetObject
                Resource: '*'
      RoleName: !Sub rol-${EnvType}-${SystemId}-taskexecute
      Tags:
        - Key: SystemId
          Value: !Ref SystemId
        - Key: Environment
          Value: !Ref EnvType
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID

  WebTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      RoleName: !Sub rol-${EnvType}-${SystemId}-task-${WebServiceNameSuffix}
      Tags:
        - Key: SystemId
          Value: !Ref SystemId
        - Key: Environment
          Value: !Ref EnvType
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID

  WebTaskRolePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub pol-${EnvType}-${SystemId}-${WebServiceNameSuffix}
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
            Resource: '*'
          - Effect: Allow
            Action:
              - logs:Create*
              - logs:Describe*
              - logs:Put*
            Resource: !GetAtt WebECSLogGroup.Arn
      Roles:
        - !Ref WebTaskRole

  ApiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      RoleName: !Sub rol-${EnvType}-${SystemId}-task-${ApiServiceNameSuffix}
      Tags:
        - Key: SystemId
          Value: !Ref SystemId
        - Key: Environment
          Value: !Ref EnvType
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID

  ApiTaskRolePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub pol-${EnvType}-${SystemId}-${ApiServiceNameSuffix}
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
            Resource: '*'
          - Effect: Allow
            Action:
              - s3:Get*
              - s3:*Object
              - s3:ListBucket
            Resource: 
              - !Sub arn:aws:s3:::s3-${EnvType}-${SystemId}-${BucketNameSuffix}*
              - !Sub arn:aws:s3:::s3-${EnvType}-${SystemId}-log-archive*
          - Effect: Allow
            Action:
              - logs:Create*
              - logs:Describe*
              - logs:Put*
            Resource: !GetAtt ApiECSLogGroup.Arn
      Roles:
        - !Ref ApiTaskRole
    
  # ---------------------------------
  # ECS TaskDefinition
  # ---------------------------------
  # only initial construction
  WebECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      ContainerDefinitions:
        - Image: 767398036381.dkr.ecr.ap-northeast-1.amazonaws.com/ecr-pri-t-didcfw-sample-web:latest
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub /ecs/ecs-task-${EnvType}-${SystemId}-${WebServiceNameSuffix}
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: !Ref WebServiceNameSuffix
          Name: !Ref WebServiceNameSuffix
          PortMappings:
            - ContainerPort: !Ref WebContainerPort
              HostPort: !Ref WebContainerPort
          # ALBのヘルスチェックがあるため、Dockerヘルスチェックは行わない
          # HealthCheck:
          Environment:
            - Name: APP_API_BASE_URL
              Value: !Sub 
              - http://ecs-service-${EnvType}-${SystemId}-${ApiServiceNameSuffix}.${EnvDiv}-${SystemId}.local:${ApiContainerPort}/
              - EnvDiv: !FindInMap [EnvType, !Ref EnvType, EnvDiv]
      Cpu: !Ref WebECSTaskCPUUnit
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      Family: !Sub ecs-task-${EnvType}-${SystemId}-${WebServiceNameSuffix}
      Memory: !Ref WebECSTaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      TaskRoleArn: !GetAtt WebTaskRole.Arn
      Tags:
        - Key: SystemId
          Value: !Ref SystemId
        - Key: Environment
          Value: !Ref EnvType
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID

  ApiECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      ContainerDefinitions:
        - Image: 767398036381.dkr.ecr.ap-northeast-1.amazonaws.com/ecr-pri-t-didcfw-sample-api:latest
          LogConfiguration:
            LogDriver: awsfirelens
          Name: !Ref ApiServiceNameSuffix
          Memory: !FindInMap [ApiECSTaskMemory, !Ref ApiECSTaskMemory, HardLimit]
          PortMappings:
            - ContainerPort: !Ref ApiContainerPort
              HostPort: !Ref ApiContainerPort
          HealthCheck:
            Command:
              - CMD-SHELL
              - !Sub curl -f http://localhost:${ApiContainerPort}${ApiHealthCheckPath} || exit 1
            Retries: 3
            Timeout: 5
            Interval: 10
          Environment:
            - Name: JAVA_OPTS
              Value: '-XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=70.0'
            ####################################################################
            # 2025/10/7 インフラテンプレート初回構築時にエラーとならないように追加 by k.kanai
            # アプリイメージへ差し替える or サンプルを稼働させる場合は、ガイド上に該当の環境変数は削除するように案内する。
            # またRedis有効化した場合に、デフォルトの環境変数でエンドポイントを連携できるように修正
            ####################################################################
            # 2026/9/2 Valkey対応（Redis EOL, Spring boot 4対応） by k.kanai
            # serverless対応もついでに追加
            - Name: SPRING_DATASOURCE_URL
              Value: ''
            - Name: SPRING_DATA_ELASTICSEARCH_REPOSITORIES_ENABLED
              Value: false
            - !If
              - IsCacheEnabled
              - !Ref AWS::NoValue
              - Name: MANAGEMENT_HEALTH_VALKEY_ENABLED
                Value: false
            - !If
              - IsCacheEnabled
              - !Ref AWS::NoValue
              - Name: MANAGEMENT_HEALTH_REDIS_ENABLED
                Value: false
            - !If
              - IsServerless
              - Name: SPRING_DATA_REDIS_CLUSTER_NODES
                Value: !Sub ${CacheServerless.Endpoint.Address}:${CacheServerless.Endpoint.Port}
              - !Ref AWS::NoValue
            - !If
              - IsProvisioned
              - Name: SPRING_DATA_REDIS_HOST
                Value: !GetAtt CacheProvisionedCluster.PrimaryEndPoint.Address
              - !Ref AWS::NoValue
            - !If
              - IsProvisioned
              - Name: SPRING_DATA_REDIS_PORT
                Value: !GetAtt CacheProvisionedCluster.PrimaryEndPoint.Port
              - !Ref AWS::NoValue
            - !If
              - IsProvisioned
              - Name: SPRING_DATA_REDIS_REPLICA_HOST
                Value: !GetAtt CacheProvisionedCluster.ReaderEndPoint.Address
              - !Ref AWS::NoValue
            - !If
              - IsProvisioned
              - Name: SPRING_DATA_REDIS_REPLICA_PORT
                Value: !GetAtt CacheProvisionedCluster.ReaderEndPoint.Port
              - !Ref AWS::NoValue
            ####################################################################
        - Image: 533994313413.dkr.ecr.ap-northeast-1.amazonaws.com/ecr-pub-p-ccntnr-fluentbit:latest
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub /ecs/ecs-task-${EnvType}-${SystemId}-${ApiServiceNameSuffix}
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: 'firelens'
          Name: firelens
          FirelensConfiguration:
            Type: 'fluentbit'
            Options:
              config-file-type: 'file'
              config-file-value: '/fluent-bit/fluent-bit-custom.conf'
          Environment:
            - Name: CONF_BUCKET_DIR
              Value: !Sub s3-${EnvType}-${SystemId}-${BucketNameSuffix}/fluentbit/conf
            - Name: LOG_BUCKET_NAME
              Value: !Sub s3-${EnvType}-${SystemId}-${BucketNameSuffix}/apllog
            - Name: LOG_GROUP_NAME
              Value: !Sub /ecs/ecs-task-${EnvType}-${SystemId}-${ApiServiceNameSuffix}
      Cpu: !Ref ApiECSTaskCPUUnit
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      Family: !Sub ecs-task-${EnvType}-${SystemId}-${ApiServiceNameSuffix}
      Memory: !Ref ApiECSTaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      TaskRoleArn: !GetAtt ApiTaskRole.Arn
      Tags:
        - Key: SystemId
          Value: !Ref SystemId
        - Key: Environment
          Value: !Ref EnvType
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID

  # ---------------------------------
  # ECS Cluster
  # ---------------------------------
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      CapacityProviders:
        - FARGATE
      ClusterName: !Sub ecs-cluster-${EnvType}-${SystemId}-${ClusterNameSuffix}
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
      ClusterSettings:
        - Name : containerInsights
          Value : !Ref ContainerInsights
      Tags:
        - Key: SystemId
          Value: !Ref SystemId
        - Key: Environment
          Value: !Ref EnvType
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID

  # ---------------------------------
  # ECS Service
  # ---------------------------------
  ServiceDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      HealthCheckCustomConfig:
        FailureThreshold: 1
      DnsConfig:
        DnsRecords:
          - Type: A
            TTL: 60
        NamespaceId: !Ref NamespaceId
      Name: !Sub ecs-service-${EnvType}-${SystemId}-${ApiServiceNameSuffix}
      Tags:
        - Key: SystemId
          Value: !Ref SystemId
        - Key: Environment
          Value: !Ref EnvType
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID

  WebECSService:
    Type: AWS::ECS::Service
    DependsOn:
      - WebECSTaskDefinition
      - ALBListener
    Properties:
      Cluster: !Ref ECSCluster
      DesiredCount: !Ref WebDesiredCount
      EnableExecuteCommand: true
      LoadBalancers:
        - ContainerName: !Ref WebServiceNameSuffix
          ContainerPort: !Ref WebContainerPort
          TargetGroupArn: !Ref WebALBTargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups: !Ref SecurityGroupIds
          Subnets: !FindInMap [EnvType, !Ref EnvType, SubnetIds]
      ServiceName: !Sub ecs-service-${EnvType}-${SystemId}-${WebServiceNameSuffix}
      TaskDefinition: !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/ecs-task-${EnvType}-${SystemId}-${WebServiceNameSuffix}
      PropagateTags: SERVICE
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      Tags:
        - Key: SystemId
          Value: !Ref SystemId
        - Key: Environment
          Value: !Ref EnvType
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID

  ApiECSService:
    Type: AWS::ECS::Service
    DependsOn: ApiECSTaskDefinition
    Properties:
      Cluster: !Ref ECSCluster
      DesiredCount: !Ref ApiDesiredCount
      EnableExecuteCommand: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups: !Ref SecurityGroupIds
          Subnets: !FindInMap [EnvType, !Ref EnvType, SubnetIds]
      ServiceName: !Sub ecs-service-${EnvType}-${SystemId}-${ApiServiceNameSuffix}
      ServiceRegistries:
        - RegistryArn: !GetAtt ServiceDiscovery.Arn
      TaskDefinition: !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/ecs-task-${EnvType}-${SystemId}-${ApiServiceNameSuffix}
      PropagateTags: SERVICE
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      Tags:
        - Key: SystemId
          Value: !Ref SystemId
        - Key: Environment
          Value: !Ref EnvType
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID

  ####################################################################
  # 2026/9/2 Valkey対応（Redis EOL, Spring boot 4対応） by k.kanai
  # serverlessもついでに追加（標準へ変更。Valkeyによって月$6から利用できるように＆大した機能は利用していないため）
  # ----------------------------------------------------------------------------
  # Serverless 構成時
  # ----------------------------------------------------------------------------
  CacheServerless:
    Type: AWS::ElastiCache::ServerlessCache
    Condition: IsServerless
    Properties:
      Description: !Sub for ${ClusterNameSuffix}
      ServerlessCacheName: !Sub 'ec-${EnvType}-${SystemId}-${CacheNameSuffix}'
      Engine: !Ref CacheEngine
      MajorEngineVersion:
        !If
          - HasCacheNodeVersion
          - !Ref CacheNodeVersion
          - !Ref AWS::NoValue
      SecurityGroupIds: !Ref SecurityGroupIds
      SubnetIds: !FindInMap [EnvType, !Ref EnvType, SubnetIds]
      CacheUsageLimits:
        DataStorage:
          !If
            - HasServerlessMemLimit
            - Maximum: !Ref CacheMaxCapacityMemory
              Unit: GB
            - !Ref AWS::NoValue
        ECPUPerSecond:
          !If
            - HasServerlessECPULimit
            - Maximum: !Ref CacheMaxCapacityECPU
            - !Ref AWS::NoValue
  # ----------------------------------------------------------------------------
  # Provisioned (ノードベース) 構成時
  # ----------------------------------------------------------------------------
  CacheSubnetGroups:
    Type: AWS::ElastiCache::SubnetGroup
    Condition: IsProvisioned
    Properties:
      CacheSubnetGroupName: !Sub ecnet-${EnvType}-${SystemId}-${CacheNameSuffix}
      Description: for cache subnet
      SubnetIds: !FindInMap [EnvType, !Ref EnvType, SubnetIds]
      Tags:
        - Key: SystemId
          Value: !Ref SystemId
        - Key: Environment
          Value: !Ref EnvType
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID

  CacheProvisionedCluster:
    Type: AWS::ElastiCache::ReplicationGroup
    Condition: IsProvisioned
    Properties:
      ReplicationGroupId: !Sub ec-${EnvType}-${SystemId}-${CacheNameSuffix}
      ReplicationGroupDescription: !Sub for ${ClusterNameSuffix}
      ClusterMode: disabled
      AutomaticFailoverEnabled: !If [IsCacheNodeMulti, true, false]
      AutoMinorVersionUpgrade: true
      AtRestEncryptionEnabled: true
      TransitEncryptionEnabled: true
      TransitEncryptionMode: required
      MultiAZEnabled: !If [IsCacheNodeMulti, true, false]
      PreferredMaintenanceWindow: 'sat:15:00-sat:16:00'
      Engine: !Ref CacheEngine
      EngineVersion:
        !If
          - HasCacheNodeVersion
          - !Ref CacheNodeVersion
          - !Ref AWS::NoValue
      CacheNodeType: !Ref CacheNodeType
      NumNodeGroups: 1
      ReplicasPerNodeGroup: !Ref CacheReplicaNodeNum
      SecurityGroupIds: !Ref SecurityGroupIds
      CacheSubnetGroupName: !Ref CacheSubnetGroups
      Port: !Ref CachePort
      CacheParameterGroupName:
        !If
        - HasCacheParameterGroupName
        - !Ref CacheParameterGroupName
        - !Ref AWS::NoValue
      KmsKeyId:
        !If
        - EncryptionByKMS
        - !Ref KMSKeyArn
        - !Ref AWS::NoValue
      Tags:
        - Key: SystemId
          Value: !Ref SystemId
        - Key: Environment
          Value: !Ref EnvType
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID
  ####################################################################
  
  #---------------------------------#
  # S3
  #---------------------------------#
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub s3-${EnvType}-${SystemId}-${BucketNameSuffix}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              !If
              - EncryptionByKMS
              - KMSMasterKeyID: !Ref KMSKeyArn
                SSEAlgorithm: 'aws:kms'
              - SSEAlgorithm: AES256
      Tags:
        - Key: SystemId
          Value: !Ref SystemId
        - Key: Environment
          Value: !Ref EnvType
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID
  
  # ---------------------------------
  # CloudWatchLogs
  # ---------------------------------
  WebECSLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId:
        !If
        - EncryptionByKMS
        - !Ref KMSKeyArn
        - !Ref AWS::NoValue
      LogGroupName: !Sub /ecs/ecs-task-${EnvType}-${SystemId}-${WebServiceNameSuffix}
      RetentionInDays: !Ref LogsRetentionInDays
      Tags:
        - Key: SystemId
          Value: !Ref SystemId
        - Key: Environment
          Value: !Ref EnvType
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID

  ApiECSLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId:
        !If
        - EncryptionByKMS
        - !Ref KMSKeyArn
        - !Ref AWS::NoValue
      LogGroupName: !Sub /ecs/ecs-task-${EnvType}-${SystemId}-${ApiServiceNameSuffix}
      RetentionInDays: !Ref LogsRetentionInDays
      Tags:
        - Key: SystemId
          Value: !Ref SystemId
        - Key: Environment
          Value: !Ref EnvType
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID

###################################
# --------------------------------#
# Output parameters
# --------------------------------#
###################################
Outputs:
  InternalALBArn:
    Value: !Ref InternalALB
    Export:
      Name: !Sub ${AWS::StackName}-InternalALBArn
  InternalALBName:
    Value: !GetAtt InternalALB.LoadBalancerName
  WebALBTargetGroupArn:
    Value: !Ref WebALBTargetGroup
    Export:
      Name: !Sub ${AWS::StackName}-WebALBTargetGroupArn
  WebALBTargetGroupName:
    Value: !GetAtt WebALBTargetGroup.TargetGroupName
  ApiALBTargetGroupName:
    Value: !GetAtt WebALBTargetGroup.TargetGroupName
  ECSCluster:
    Value: !Ref ECSCluster
    Export:
      Name: !Sub ${AWS::StackName}-ECSCluster
  WebECSTaskDefinitionArn:
    Value: !Ref WebECSTaskDefinition
    Export:
      Name: !Sub ${AWS::StackName}-WebECSTaskDefinitionArn
  ApiECSTaskDefinitionArn:
    Value: !Ref ApiECSTaskDefinition
    Export:
      Name: !Sub ${AWS::StackName}-ApiECSTaskDefinitionArn