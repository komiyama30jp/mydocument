AWSTemplateFormatVersion: '2010-09-09'
Description: s3files Construction
###################################
# --------------------------------#
# Metadata
# --------------------------------#
###################################
Metadata: 
  AWS::CloudFormation::Interface: 
    ParameterGroups: 
      - Label:
          default: Project Configuration
        Parameters:
          - SystemId
          - EnvType
          - BillingID
          - SecurityGroupIds
      - Label: 
          default: "S3file Configuration"
        Parameters:
          - BucketNameSuffix
          - AccessPointEnabled
          - AccessPointUid
          - AccessPointGid
          - TaskRoleName
      - Label:
          default: KMS Configuration
        Parameters:
          - KMSKeyArn

###################################
#---------------------------------#
# Mappings Section
#---------------------------------#
###################################
Mappings:
  EnvType:

    t:
      EnvDiv: dev
      VpcId: vpc-0ce3d06582237bf4e
      SubnetIds: 
        - subnet-08d7e4edc502d4f3e
        - subnet-0f45e8713b99a43e5
        - subnet-0fdd903190ab25f54
    k:
      EnvDiv: dev
      VpcId: vpc-0ce3d06582237bf4e
      SubnetIds: 
        - subnet-08d7e4edc502d4f3e
        - subnet-0f45e8713b99a43e5
        - subnet-0fdd903190ab25f54
    v:
      EnvDiv: dev
      VpcId: vpc-0ce3d06582237bf4e
      SubnetIds: 
        - subnet-08d7e4edc502d4f3e
        - subnet-0f45e8713b99a43e5
        - subnet-0fdd903190ab25f54
    e:
      EnvDiv: dev
      VpcId: vpc-0ce3d06582237bf4e
      SubnetIds: 
        - subnet-08d7e4edc502d4f3e
        - subnet-0f45e8713b99a43e5
        - subnet-0fdd903190ab25f54
    i:
      EnvDiv: dev
      VpcId: vpc-0ce3d06582237bf4e
      SubnetIds: 
        - subnet-08d7e4edc502d4f3e
        - subnet-0f45e8713b99a43e5
        - subnet-0fdd903190ab25f54
    s:
      EnvDiv: dev
      VpcId: vpc-0ce3d06582237bf4e
