###################################
#---------------------------------#
# Parameters Section
#---------------------------------#
###################################            
Parameters:
  # Project Configuration
  SystemId:
    Type: String
    Description: Enter your system id.
    MinLength: 6
    MaxLength: 6
  EnvType:
    Type: String
    Description: Select the environment.
    AllowedValues:
#      - a
      - t
      - k
      - v
      - e
      - i
      - s
      - m
      - p
  BillingID:
    Type: String
    Description: Enter the BillingID.
    MinLength: 1
  # S3files Configuration
  BucketNameSuffix:
    Type: String
    Description: Enter your bucket name:s3-(EnvType)-(SystemId)-(BucketNameSuffix).
    Default: files-01
    MinLength: 1
  AccessPointEnabled:
    Type: String
    Default: true
    AllowedValues: 
      - true
      - false
  AccessPointUid:
    Type: String
    Default: 5001
  AccessPointGid:
    Type: String
    Default: 500
  TaskRoleName:
    Type: String
    Description: Enter your IAM Role(TaskRole) name to allow access to s3files.

  # sercurity group
  SecurityGroupIds:
    Description: Select the Security Group IDs for resources
    Type: List<AWS::EC2::SecurityGroup::Id>
    MinLength: 1

  # kms key
  KMSKeyArn:
    Type: String
    Description: Note! For accounts located in the Security Data OU, please enter the arn of your customer key arn.
    AllowedPattern: ^(arn:aws:kms:.*:(\d{12})?:(key|alias)/.+|)\Z

###################################
#---------------------------------#
# Conditions Section
#---------------------------------#
###################################   
Conditions:
  IsAccessPointEnabled:
    !Equals [true,!Ref AccessPointEnabled]
  EncryptionByKMS: 
    !Not [!Equals [!Ref KMSKeyArn, '']]
  ShouldAttachedClientPollicy: 
    !Not [!Equals [!Ref TaskRoleName, '']]
###################################
#---------------------------------#
# Resources Section
#---------------------------------#
###################################    
Resources:

  #---------------------------------#
  # S3
  #---------------------------------#
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub s3-${EnvType}-${SystemId}-${BucketNameSuffix}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              !If
              - EncryptionByKMS
              - 
                KMSMasterKeyID: !Ref KMSKeyArn
                SSEAlgorithm: 'aws:kms'
              - 
                SSEAlgorithm: AES256
      Tags:
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID

  S3FilesRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - elasticfilesystem.amazonaws.com
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:aws:s3files:${AWS::Region}:${AWS::AccountId}:file-system/*
      RoleName: !Sub rol-fs-${EnvType}-${SystemId}-${BucketNameSuffix}
      Tags:
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID


  S3FilesPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub pol-fs-${EnvType}-${SystemId}-${BucketNameSuffix}
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: S3BucketPermissions
            Effect: Allow
            Action:
              - s3:ListBucket*
              - s3:ListBucketVersions
            Resource: !Sub arn:aws:s3:::s3-${EnvType}-${SystemId}-${BucketNameSuffix}
            Condition:
              StringEquals:
                aws:ResourceAccount: !Ref AWS::AccountId
          - Sid: S3ObjectPermissions
            Effect: Allow
            Action:
              - s3:AbortMultipartUpload
              - s3:DeleteObject*
              - s3:GetObject*
              - s3:List*
              - s3:PutObject*
            Resource: !Sub arn:aws:s3:::s3-${EnvType}-${SystemId}-${BucketNameSuffix}/*
            Condition:
              StringEquals:
                aws:ResourceAccount: !Ref AWS::AccountId
          - Sid: UseKmsKeyWithS3Files
            Effect: Allow
            Action:
              - kms:GenerateDataKey
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncryptFrom
              - kms:ReEncryptTo
            Resource: !Sub arn:aws:kms:ap-northeast-1:${AWS::AccountId}:*
            Condition:
              StringLike:
                kms:ViaService: s3.ap-northeast-1.amazonaws.com
                kms:EncryptionContext:aws:s3:arn:
                  - !Sub arn:aws:s3:::s3-${EnvType}-${SystemId}-${BucketNameSuffix}
                  - !Sub arn:aws:s3:::s3-${EnvType}-${SystemId}-${BucketNameSuffix}/*
          - Sid: EventBridgeManage
            Effect: Allow
            Action:
              - events:DeleteRule
              - events:DisableRule
              - events:EnableRule
              - events:PutRule
              - events:PutTargets
              - events:RemoveTargets
            Resource:
            - arn:aws:events:*:*:rule/DO-NOT-DELETE-S3-Files*
            Condition:
              StringEquals:
                events:ManagedBy: elasticfilesystem.amazonaws.com
          - Sid: EventBridgeRead
            Effect: Allow
            Action:
              - events:DescribeRule
              - events:ListRuleNamesByTarget
              - events:ListRules
              - events:ListTargetsByRule
            Resource:
              - arn:aws:events:*:*:rule/*
      Roles:
        - !Ref S3FilesRole

  S3FileSystem:
    Type: AWS::S3Files::FileSystem
    Properties:
      Bucket: !GetAtt S3Bucket.Arn
      RoleArn: !GetAtt S3FilesRole.Arn
      KmsKeyId: !If
        - EncryptionByKMS
        - !Ref KMSKeyArn
        - !Ref AWS::NoValue
      Tags:
        - Key: SystemId
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID
        - Key: Name
          Value: !Sub fs-${EnvType}-${SystemId}-${BucketNameSuffix}

  MountTarget1:
    Type: AWS::S3Files::MountTarget
    Properties:
      FileSystemId: !Ref S3FileSystem
      SubnetId: !Select [ 0, !FindInMap [EnvType, !Ref EnvType, SubnetIds] ]
      SecurityGroups: !Ref SecurityGroupIds

  MountTarget2:
    Type: AWS::S3Files::MountTarget
    Properties:
      FileSystemId: !Ref S3FileSystem
      SubnetId: !Select [ 1, !FindInMap [EnvType, !Ref EnvType, SubnetIds] ]
      SecurityGroups: !Ref SecurityGroupIds

  MountTarget3:
    Type: AWS::S3Files::MountTarget
    Properties:
      FileSystemId: !Ref S3FileSystem
      SubnetId: !Select [ 2, !FindInMap [EnvType, !Ref EnvType, SubnetIds] ]
      SecurityGroups: !Ref SecurityGroupIds


  AccessPointResource:
    Type: 'AWS::S3Files::AccessPoint'
    Condition: IsAccessPointEnabled
    Properties:
      FileSystemId: !Ref S3FileSystem
      PosixUser:
        Uid: !Ref AccessPointUid
        Gid: !Ref AccessPointGid
      RootDirectory:
        CreationPermissions:
          OwnerGid: !Ref AccessPointGid
          OwnerUid: !Ref AccessPointUid
          Permissions: "0775"
        Path: "/apl"
      Tags:
        - Key: Name
          Value: !Sub ap-fs-${EnvType}-${SystemId}-${BucketNameSuffix}

  ECSClientPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub pol-client-fs-${EnvType}-${SystemId}-${BucketNameSuffix}
      Roles: !If
        - ShouldAttachedClientPollicy
        - [ !Ref TaskRoleName ]
        - !Ref AWS::NoValue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: S3ObjectReadAccess
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:ListBucket
            Resource:
              - !Sub arn:aws:s3:::s3-${EnvType}-${SystemId}-${BucketNameSuffix}*
          - Sid: S3FilesClientAccess
            Effect: Allow
            Action:
              - s3files:ClientMount
              - s3files:ClientWrite
              - s3files:ClientRootAccess
            Resource:
              - !GetAtt S3FileSystem.FileSystemArn
              - !If
                - IsAccessPointEnabled
                - !GetAtt AccessPointResource.AccessPointArn
                - !Ref AWS::NoValue

###################################
# --------------------------------#
# Output parameters
# --------------------------------#
###################################
Outputs:
  S3BucketArn:
    Value: !GetAtt S3Bucket.Arn
  S3BucketName:
    Value: !Ref S3Bucket
  S3FileSystemArn:
    Value: !GetAtt S3FileSystem.FileSystemArn
  S3FileSystemName:
    Value: !Sub fs-${EnvType}-${SystemId}-${BucketNameSuffix}
  ManagedPolicyName:
    Value: !Sub pol-client-fs-${EnvType}-${SystemId}-${BucketNameSuffix}
