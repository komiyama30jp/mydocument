---
AWSTemplateFormatVersion: "2010-09-09"
Description: Create GithubActions-related resources.
###################################
# --------------------------------#
# Metadata
# --------------------------------#
###################################
Metadata:
  AWS::CloudFormation::Interface:
    # パラメータの並び順
    ParameterGroups:
      - Label:
          default: "Project Configuration"
        Parameters:
          - SystemId
          - EnvType
          - BillingID
          
      - Label:
          default: "GithubActions Configuration"
        Parameters:
          - GitHubRepositoryName
      - Label:
          default: "GithubActions Configuration"
        Parameters:
          - GitHubOwner

###################################
#---------------------------------#
# Parameters Section
#---------------------------------#
###################################            
Parameters:
  SystemId:
    Type: String
    Description: Enter the system id.
    MinLength: 6
    MaxLength: 6
  EnvType:
    Type: String
    Description: Select the environment.
    AllowedValues:
      - t
      - k
      - v
      - e
      - i
      - s
      - m
      - p
  BillingID:
    Type: String
    Description: Enter the BillingID.
  
  GitHubRepositoryName:
    Description: GitHub Repository Name.
    Type: String
  
  GitHubOwner:
    Description: GitHub Owner.
    Default: dentsusoken
    Type: String

###################################
#---------------------------------#
# Resources Section
#---------------------------------#
###################################     
Resources:
  # ---------------------------------
  # IAM Role
  # ---------------------------------
  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub rol-${EnvType}-${SystemId}-github-${GitHubRepositoryName}
      Description: GitHub Actions Access Role
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Condition:
              StringLike:
                token.actions.githubusercontent.com:sub:
                  !Sub 'repo:${GitHubOwner}/${GitHubRepositoryName}:*'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonECS_FullAccess
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPowerUser
        - arn:aws:iam::aws:policy/AWSCodePipeline_FullAccess
        - arn:aws:iam::aws:policy/SecretsManagerReadWrite
      Policies:
        - PolicyName: AllowGithubActions
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: 
                  - codedeploy:Get*
                  - codedeploy:Batch*
                  - codedeploy:List*
                  - codedeploy:CreateDeployment
                  - codedeploy:RegisterApplicationRevision
                  - iam:GetGroup*
                  - iam:List*
                  - iam:PassRole
                  - kms:Decrypt
                  - ssm:*ToResource
                  - ssm:*Parameter*
                Resource: '*'
      Tags:
        - Key: SystemId
          Value: !Ref SystemId
        - Key: Environment
          Value: !Ref EnvType
        - Key: Cost1
          Value: !Ref SystemId
        - Key: BillingID
          Value: !Ref BillingID

###################################
#---------------------------------#
# Outputs Section
#---------------------------------#
###################################
Outputs:
  RoleArn:
    Value: !GetAtt Role.Arn